services:
  doctor-site:
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    expose:
      - '3020'
    # No local volumes needed — DB (Neon Postgres) and uploads (Vercel Blob)
    # are both external managed services, set via .env.production.
    env_file:
      - .env.production

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - doctor-site

volumes:
  caddy-data:
  caddy-config:

